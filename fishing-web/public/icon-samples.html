<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: system-ui; background: #f7f7f8; padding: 40px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 800px; margin: 0 auto; }
  .card { background: white; border-radius: 12px; padding: 24px; text-align: center; border: 1px solid #e5e5e5; }
  .card svg { width: 64px; height: 64px; margin-bottom: 12px; }
  .card p { font-size: 14px; color: #666; }
  h1 { text-align: center; margin-bottom: 32px; }
</style>
</head>
<body>
<h1>Fishing Icon Samples</h1>
<div class="grid">

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="62" x2="30" y2="8"/>
      <path d="M30 8 Q50 6 54 16 Q58 26 44 30"/>
      <line x1="44" y1="30" x2="44" y2="42"/>
      <path d="M44 42 Q44 50 38 50 Q32 50 32 42" stroke="#ef4444"/>
    </svg>
    <p>1. Current (Pole + Hook)</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 32 Q16 20 24 28 Q32 36 40 24 Q48 12 56 20"/>
      <path d="M56 20 Q60 24 56 28 Q52 32 48 28"/>
      <circle cx="52" cy="22" r="1.5" fill="#2563eb"/>
      <path d="M8 32 Q4 36 8 40 Q12 36 8 32Z" fill="#ef4444" stroke="#ef4444"/>
    </svg>
    <p>2. Fish</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="32" y1="4" x2="32" y2="20"/>
      <ellipse cx="32" cy="30" rx="8" ry="10"/>
      <line x1="24" y1="30" x2="40" y2="30"/>
      <path d="M24 30 Q24 20 32 20 Q40 20 40 30" fill="#ef4444" stroke="#ef4444"/>
      <line x1="32" y1="40" x2="32" y2="52"/>
      <path d="M20 56 Q32 48 44 56" stroke="#2563eb" stroke-width="2"/>
      <path d="M16 60 Q32 52 48 60" stroke="#2563eb" stroke-width="2"/>
    </svg>
    <p>3. Bobber on Water</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="32" cy="28" r="14"/>
      <circle cx="32" cy="28" r="6"/>
      <line x1="32" y1="14" x2="32" y2="4"/>
      <path d="M24 40 L20 58"/>
      <path d="M40 40 L44 58"/>
      <line x1="16" y1="58" x2="48" y2="58"/>
      <circle cx="32" cy="28" r="2" fill="#ef4444" stroke="#ef4444"/>
    </svg>
    <p>4. Fishing Reel</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 4 L32 20"/>
      <path d="M32 20 L18 56"/>
      <path d="M32 20 L46 56"/>
      <line x1="14" y1="56" x2="50" y2="56"/>
      <path d="M22 32 L42 32"/>
      <path d="M20 44 L44 44"/>
      <path d="M32 20 Q44 26 42 32"/>
      <path d="M32 20 Q20 26 22 32"/>
    </svg>
    <p>5. Fishing Net</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 44 Q8 32 20 32 L44 32 Q56 32 56 44 L52 52 L12 52 Z"/>
      <line x1="32" y1="12" x2="32" y2="32"/>
      <path d="M32 12 L46 12 L46 18" stroke="#ef4444"/>
      <path d="M4 52 Q16 58 32 56 Q48 58 60 52" stroke-width="2"/>
      <path d="M2 58 Q16 64 32 62 Q48 64 62 58" stroke-width="2"/>
    </svg>
    <p>6. Fishing Boat</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 8 Q28 16 28 24 Q28 32 36 38 Q44 32 44 24 Q44 16 36 8Z" fill="#2563eb" opacity="0.1"/>
      <path d="M36 8 Q28 16 28 24 Q28 32 36 38 Q44 32 44 24 Q44 16 36 8Z"/>
      <path d="M44 24 Q50 20 54 24 Q50 28 44 24Z"/>
      <circle cx="32" cy="20" r="2" fill="#2563eb"/>
      <path d="M4 48 Q16 40 28 48 Q40 56 52 48 Q58 44 62 48" stroke-width="2"/>
      <path d="M4 56 Q16 48 28 56 Q40 64 52 56 Q58 52 62 56" stroke-width="2"/>
      <path d="M36 38 Q34 42 36 48" stroke-dasharray="3 3"/>
    </svg>
    <p>7. Fish Jumping</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="32" y1="4" x2="32" y2="56"/>
      <path d="M32 56 L20 48 L32 40 L44 48 Z" fill="#ef4444" stroke="#ef4444"/>
      <path d="M32 4 Q48 4 48 16 Q48 28 32 28"/>
      <path d="M32 4 Q16 4 16 16 Q16 28 32 28"/>
      <line x1="20" y1="60" x2="44" y2="60"/>
    </svg>
    <p>8. Anchor</p>
  </div>

  <div class="card">
    <svg viewBox="0 0 64 64" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- ring at head -->
      <circle cx="8" cy="32" r="4" stroke="#999"/>
      <!-- body (white) -->
      <path d="M12 32 Q20 24 32 24 Q46 24 50 32 Q46 40 32 40 Q20 40 12 32Z" fill="white" stroke="#ccc"/>
      <!-- red head -->
      <path d="M12 32 Q16 26 22 26 Q26 26 26 32 Q26 38 22 38 Q16 38 12 32Z" fill="#ef4444" opacity="0.8" stroke="#ef4444"/>
      <!-- belly line -->
      <path d="M26 34 Q38 38 48 34" stroke="#ccc" stroke-width="1.5"/>
      <!-- back stripes -->
      <line x1="30" y1="25" x2="32" y2="30" stroke="#ddd" stroke-width="1.5"/>
      <line x1="36" y1="24.5" x2="38" y2="30" stroke="#ddd" stroke-width="1.5"/>
      <line x1="42" y1="25.5" x2="43" y2="30" stroke="#ddd" stroke-width="1.5"/>
      <!-- tail fin -->
      <path d="M50 32 L58 24 L58 40 Z" fill="#ef4444" opacity="0.3" stroke="#ef4444"/>
      <!-- eye -->
      <circle cx="18" cy="31" r="2.5" fill="white" stroke="#333"/>
      <circle cx="18.5" cy="31" r="1" fill="#333"/>
      <!-- front treble hook -->
      <line x1="24" y1="40" x2="24" y2="48" stroke="#999"/>
      <path d="M24 48 Q24 52 20 52 Q18 50 20 48" stroke="#ef4444" stroke-width="2"/>
      <path d="M24 48 Q24 52 28 52 Q30 50 28 48" stroke="#ef4444" stroke-width="2"/>
      <!-- rear treble hook -->
      <line x1="42" y1="40" x2="42" y2="48" stroke="#999"/>
      <path d="M42 48 Q42 52 38 52 Q36 50 38 48" stroke="#ef4444" stroke-width="2"/>
      <path d="M42 48 Q42 52 46 52 Q48 50 46 48" stroke="#ef4444" stroke-width="2"/>
      <!-- lip/bill -->
      <path d="M12 32 L6 38" stroke="#2563eb" stroke-width="2.5"/>
    </svg>
    <p>9. Minnow Lure</p>
  </div>

</div>
</body>
</html>
